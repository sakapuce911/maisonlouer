<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Détails de l’annonce - MaisonLouer</title>

  <meta name="description" content="Détails de l’annonce sur MaisonLouer : photos, prix, description et contact." />

  <link rel="shortcut icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="stylesheet" href="./assets/css/custom.css">
  <link rel="stylesheet" href="./assets/css/fix-header.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <style>
    .annonce-wrap { padding: 120px 0 70px; }
    .annonce-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; margin-bottom: 14px; }
    .annonce-kicker { margin: 0 0 6px; color: #6b7280; font-weight: 800; letter-spacing: .02em; }
    .annonce-title { margin: 0; font-size: 34px; line-height: 1.15; font-weight: 900; color: #111827; }
    .annonce-sub { margin: 10px 0 0; color: #6b7280; }

    .annonce-badges { display: flex; gap: 10px; flex-wrap: wrap; }
    .pill { display:inline-flex;align-items:center;gap:8px;padding:9px 12px;border-radius:999px;font-weight:900;font-size:12px;letter-spacing:.02em;border:1px solid #e5e7eb;background:#fff;color:#111827;white-space:nowrap; }
    .pill.green { background: rgba(16,185,129,.10); border-color: rgba(16,185,129,.25); color: #065f46; }
    .pill.blue { background: rgba(59,130,246,.10); border-color: rgba(59,130,246,.22); color: #1e40af; }
    .pill.gray { background: rgba(17,24,39,.06); border-color: rgba(17,24,39,.12); color: #111827; }

    .annonce-grid { display:grid; grid-template-columns: 1.35fr 0.9fr; gap:18px; align-items:start; margin-top:18px; }

    .card { background:#fff; border:1px solid #e5e7eb; border-radius:18px; box-shadow:0 10px 22px rgba(0,0,0,.06); overflow:hidden; }

    .gallery-main { position:relative; background:#111827; aspect-ratio:16/10; display:flex; align-items:center; justify-content:center; }
    .gallery-main img { width:100%; height:100%; object-fit:cover; display:block; }
    .gallery-nav { position:absolute; inset:0; pointer-events:none; display:flex; align-items:center; justify-content:space-between; padding:14px; }
    .gbtn { pointer-events:all; width:44px; height:44px; border-radius:999px; border:1px solid rgba(255,255,255,.35); background:rgba(0,0,0,.30); color:#fff; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
    .gbtn:active { transform: translateY(1px); }

    .gallery-thumbs { display:grid; grid-template-columns:repeat(6,1fr); gap:10px; padding:12px; background:#fff; border-top:1px solid #e5e7eb; }
    .thumb { border:2px solid transparent; border-radius:12px; overflow:hidden; cursor:pointer; background:#f3f4f6; aspect-ratio:1/1; }
    .thumb img { width:100%; height:100%; object-fit:cover; display:block; }
    .thumb.is-active { border-color: rgba(255,107,0,.85); }

    .side-pad { padding:16px; }
    .price { font-size:28px; font-weight:900; color:#111827; margin:0 0 8px; }
    .meta-row { display:flex; align-items:center; gap:10px; color:#374151; margin-top:8px; }
    .meta-row ion-icon { font-size:18px; }
    .meta-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:14px; }
    .kpi { border:1px solid #e5e7eb; border-radius:14px; padding:10px; background:#fff; text-align:center; }
    .kpi strong { display:block; font-size:16px; color:#111827; }
    .kpi span { display:block; font-size:12px; color:#6b7280; font-weight:800; margin-top:3px; }

    /* ✅ CTA : WhatsApp + Email côte à côte, Retour sur 1 ligne */
    .cta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 16px;
    }
    .cbtn {
      border:none;
      border-radius:14px;
      padding: 12px 14px;
      font-weight:900;
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      text-decoration:none;
      width:100%;
    }
    .cbtn.primary { background:#ff6b00; color:#fff; }
    .cbtn.dark { background:#111827; color:#fff; }
    .cbtn.ghost { background:#fff; color:#111827; border:2px solid #e5e7eb; grid-column: 1 / -1; }

    .content-pad { padding:16px; }
    .h3t { margin:0 0 10px; font-size:18px; font-weight:900; color:#111827; }
    .desc { margin:0; color:#374151; line-height:1.75; white-space:pre-line; }

    .backrow { margin-top:18px; display:flex; gap:12px; flex-wrap:wrap; }
    .backrow a { text-decoration:none; }

    @media (max-width:980px){
      .annonce-grid{grid-template-columns:1fr;}
      .gallery-thumbs{grid-template-columns:repeat(5,1fr);}
      .annonce-title{font-size:30px;}
    }

    @media (max-width:640px){
      .annonce-wrap{padding:105px 0 60px;}
      .annonce-title{font-size:26px;}
      .gallery-thumbs{grid-template-columns:repeat(4,1fr);}
      .price{font-size:24px;}

      /* ✅ Mobile : CTA en colonne */
      .cta { grid-template-columns: 1fr; }
      .cbtn.ghost { grid-column: auto; }
    }
  </style>
</head>

<body>

  <!-- ✅ HEADER identique aux autres pages (index/contact) -->
  <header class="header" data-header>
    <div class="overlay" data-overlay></div>

    <div class="header-bottom">
      <div class="container">

        <a href="index.html" class="logo" aria-label="Retour à l'accueil">
          <img src="./assets/images/logo.webp" alt="Logo MaisonLouer">
        </a>

        <nav class="navbar" data-navbar>
          <div class="navbar-top">
            <a href="index.html" class="logo" aria-label="Retour à l'accueil">
              <img src="./assets/images/logo.webp" alt="Logo MaisonLouer">
            </a>

            <button class="nav-close-btn" data-nav-close-btn aria-label="Fermer le menu">
              <ion-icon name="close-outline"></ion-icon>
            </button>
          </div>

          <div class="navbar-bottom">
            <ul class="navbar-list">
              <li><a href="index.html" class="navbar-link" data-nav-link>Accueil</a></li>
              <li><a href="locations.html" class="navbar-link" data-nav-link>Maisons à louer</a></li>
              <li><a href="ventes.html" class="navbar-link" data-nav-link>Maisons à vendre</a></li>
              <li><a href="recherche.html" class="navbar-link" data-nav-link>Je cherche un bien</a></li>
              <li><a href="contact.html" class="navbar-link" data-nav-link>Contact</a></li>
            </ul>
          </div>
        </nav>

        <div class="header-bottom-actions">
          <button class="header-bottom-actions-btn" data-nav-open-btn aria-label="Ouvrir le menu">
            <ion-icon name="menu-outline"></ion-icon>
            <span>Menu</span>
          </button>
        </div>

      </div>
    </div>
  </header>

  <main class="annonce-wrap">
    <div class="container">
      <div id="annonce-container">
        <p>Annonce en cours de chargement...</p>
      </div>

      <div class="backrow">
        <a href="recherche.html" class="btn">Retour à la recherche</a>
        <a href="locations.html" class="btn">Voir les locations</a>
        <a href="ventes.html" class="btn">Voir les ventes</a>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="footer-bottom">
      <div class="container">
        <p class="copyright">
          &copy; 2026 <a href="index.html">MaisonLouer</a>. Tous droits réservés.
        </p>
      </div>
    </div>
  </footer>

  <script src="./assets/js/script.js"></script>

  <script>
    (function () {
      const container = document.getElementById("annonce-container");
      if (!container) return;

      // ✅ Email global MaisonLouer
      const CONTACT_EMAIL = "maisonlouer.mada@outlook.com";

      // ✅ WhatsApp par défaut si l'annonce n'en a pas
      const DEFAULT_WA = "261385436196";

      function norm(str) { return (str || "").toString().trim().toLowerCase(); }

      function formatPriceAr(prixAr) {
        if (prixAr === null || prixAr === undefined || prixAr === "") return "Prix sur demande";
        const n = Number(prixAr);
        if (Number.isNaN(n)) return "Prix sur demande";
        return `${n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ")} Ar`;
      }

      async function fetchWithTimeout(url, options = {}, timeoutMs = 8000) {
        const controller = new AbortController();
        const id = setTimeout(() => controller.abort(), timeoutMs);
        try { return await fetch(url, { ...options, signal: controller.signal }); }
        finally { clearTimeout(id); }
      }

      // ✅ Uniquement Notion via /api/annonces (plus de fallback JSON)
      async function fetchAnnoncesFromApiOnly() {
        const res = await fetchWithTimeout("/api/annonces", { method: "GET" }, 8000);
        if (!res.ok) throw new Error(`API indisponible (${res.status})`);
        const data = await res.json();
        if (!Array.isArray(data)) throw new Error("Format API invalide (attendu: tableau)");
        return data;
      }

      function buildWhatsAppLink(waDigits, titre, pageUrl) {
        const phone = (waDigits || "").toString().replace(/[^\d]/g, "") || DEFAULT_WA;
        const msg = `Bonjour, je suis intéressé(e) par cette annonce : ${titre}\nLien : ${pageUrl}`;
        return `https://wa.me/${phone}?text=${encodeURIComponent(msg)}`;
      }

      function buildMailLink(titre, pageUrl) {
        const subject = `Demande d'information - ${titre}`;
        const body = `Bonjour,\n\nJe suis intéressé(e) par l'annonce : ${titre}\nLien : ${pageUrl}\n\nMerci.`;
        return `mailto:${CONTACT_EMAIL}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
      }

      function buildHtml(a) {
        const titre = a.titre || "Annonce";
        const offre = norm(a.typeOffre);
        const bien = norm(a.typeBien);

        const badgeOffre = (offre === "location") ? "À LOUER" : (offre === "vente" ? "EN VENTE" : "ANNONCE");
        const pillOffreClass = (offre === "location") ? "green" : (offre === "vente" ? "blue" : "gray");
        const badgeBien = bien ? bien.toUpperCase() : "BIEN";

        const prix = formatPriceAr(a.prixAr);

        const ville = a.ville || "";
        const quartier = a.quartier || "";
        const adresse = [quartier, ville].filter(Boolean).join(", ") || "Madagascar";

        const chambres = (a.chambres !== null && a.chambres !== undefined) ? Number(a.chambres) : null;
        const sdb = (a.sdb !== null && a.sdb !== undefined) ? Number(a.sdb) : null;
        const surface = (a.surface !== null && a.surface !== undefined) ? Number(a.surface) : null;

        const description = a.description ? a.description : "Aucune description pour le moment.";

        const images = Array.isArray(a.images) ? a.images.filter(Boolean) : [];
        const mainImg = images.length ? images[0] : "./assets/images/property-1.jpg";

        const pageUrl = window.location.href;
        const waLink = buildWhatsAppLink(a.whatsapp, titre, pageUrl);
        const mailLink = buildMailLink(titre, pageUrl);

        return `
          <div class="annonce-head">
            <div>
              <p class="annonce-kicker">MaisonLouer</p>
              <h1 class="annonce-title">${titre}</h1>
              <p class="annonce-sub"><span>${adresse}</span></p>
            </div>

            <div class="annonce-badges">
              <span class="pill ${pillOffreClass}">
                <ion-icon name="pricetag-outline"></ion-icon>
                ${badgeOffre}
              </span>
              <span class="pill gray">
                <ion-icon name="home-outline"></ion-icon>
                ${badgeBien}
              </span>
            </div>
          </div>

          <div class="annonce-grid">
            <div style="display:grid; gap:18px;">
              <div class="card">
                <div class="gallery-main">
                  <img id="galleryMainImg" src="${mainImg}" alt="${titre}">
                  <div class="gallery-nav" aria-hidden="false">
                    <button class="gbtn" id="gPrev" type="button" aria-label="Photo précédente">
                      <ion-icon name="chevron-back-outline"></ion-icon>
                    </button>
                    <button class="gbtn" id="gNext" type="button" aria-label="Photo suivante">
                      <ion-icon name="chevron-forward-outline"></ion-icon>
                    </button>
                  </div>
                </div>

                <div class="gallery-thumbs" id="galleryThumbs">
                  ${images.length
                    ? images.slice(0, 12).map((src, idx) => `
                        <div class="thumb ${idx === 0 ? "is-active" : ""}" data-idx="${idx}" role="button" tabindex="0" aria-label="Voir la photo ${idx + 1}">
                          <img src="${src}" alt="${titre} - photo ${idx + 1}">
                        </div>
                      `).join("")
                    : `
                      <div class="thumb is-active" data-idx="0" role="button" tabindex="0" aria-label="Voir la photo 1">
                        <img src="${mainImg}" alt="${titre} - photo 1">
                      </div>
                    `
                  }
                </div>
              </div>

              <div class="card">
                <div class="content-pad">
                  <h3 class="h3t">Description du bien</h3>
                  <p class="desc">${description}</p>
                </div>
              </div>
            </div>

            <aside class="card">
              <div class="side-pad">
                <p class="price">${prix}</p>

                <div class="meta-row">
                  <ion-icon name="location-outline"></ion-icon>
                  <span>${adresse}</span>
                </div>

                <div class="meta-grid">
                  <div class="kpi"><strong>${chambres !== null ? chambres : "-"}</strong><span>Chambres</span></div>
                  <div class="kpi"><strong>${sdb !== null ? sdb : "-"}</strong><span>SDB</span></div>
                  <div class="kpi"><strong>${surface !== null ? surface : "-"}</strong><span>m²</span></div>
                </div>

                <!-- ✅ CTA alignés -->
                <div class="cta">
                  <a class="cbtn primary" href="${waLink}" target="_blank" rel="noopener">
                    <ion-icon name="logo-whatsapp"></ion-icon>
                    Contacter sur WhatsApp
                  </a>

                  <a class="cbtn dark" href="${mailLink}">
                    <ion-icon name="mail-outline"></ion-icon>
                    Envoyer un email
                  </a>

                  <a class="cbtn ghost" href="recherche.html">
                    <ion-icon name="search-outline"></ion-icon>
                    Retour recherche
                  </a>
                </div>

                <p style="margin:14px 0 0; color:#6b7280; font-size:13px; line-height:1.6;">
                  Astuce : indiquez votre budget, la zone et si vous cherchez plutôt à louer ou acheter.
                </p>
              </div>
            </aside>
          </div>
        `;
      }

      function initGallery(images) {
        const imgEl = document.getElementById("galleryMainImg");
        const thumbs = document.getElementById("galleryThumbs");
        const prev = document.getElementById("gPrev");
        const next = document.getElementById("gNext");
        if (!imgEl || !prev || !next || !thumbs) return;

        const list = (Array.isArray(images) && images.length) ? images.filter(Boolean) : [imgEl.src];
        let idx = 0;

        const setActive = (i) => {
          idx = (i + list.length) % list.length;
          imgEl.src = list[idx];
          const all = thumbs.querySelectorAll(".thumb");
          all.forEach(t => t.classList.remove("is-active"));
          const current = thumbs.querySelector(`.thumb[data-idx="${idx}"]`);
          if (current) current.classList.add("is-active");
        };

        prev.addEventListener("click", () => setActive(idx - 1));
        next.addEventListener("click", () => setActive(idx + 1));

        thumbs.addEventListener("click", (e) => {
          const t = e.target.closest(".thumb");
          if (!t) return;
          const i = Number(t.getAttribute("data-idx"));
          if (!Number.isNaN(i)) setActive(i);
        });

        thumbs.addEventListener("keydown", (e) => {
          const t = e.target.closest(".thumb");
          if (!t) return;
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            const i = Number(t.getAttribute("data-idx"));
            if (!Number.isNaN(i)) setActive(i);
          }
        });

        if (list.length <= 1) { prev.style.display = "none"; next.style.display = "none"; }
      }

      async function init() {
        const params = new URLSearchParams(window.location.search);
        const id = params.get("id");

        if (!id) {
          container.innerHTML = `<p style="color:#b00020; font-weight:800;">Erreur : aucune annonce sélectionnée. (ID manquant)</p>`;
          return;
        }

        let annonces = [];
        try {
          annonces = await fetchAnnoncesFromApiOnly();
        } catch (e) {
          container.innerHTML = `
            <p style="color:#b00020; font-weight:800;">
              Impossible de charger l’annonce (API Notion).<br>
              Détail : ${e.message}
            </p>
          `;
          return;
        }

        const a = annonces.find(x => String(x.id) === String(id));
        if (!a) {
          container.innerHTML = `<p style="color:#b00020; font-weight:800;">Annonce introuvable (ID : ${id}).</p>`;
          return;
        }

        document.title = `${a.titre || "Annonce"} - MaisonLouer`;
        const metaDesc = document.querySelector('meta[name="description"]');
        if (metaDesc) {
          const snippet = (a.description || "").replace(/\s+/g, " ").trim();
          metaDesc.setAttribute("content", snippet ? snippet.slice(0, 160) : "Détails de l’annonce sur MaisonLouer.");
        }

        container.innerHTML = buildHtml(a);
        initGallery(a.images);
      }

      init();
    })();
  </script>

  <!-- ionicons -->
  <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>

</body>
</html>
