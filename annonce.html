<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Détails de l’annonce - MaisonLouer</title>

  <meta name="description" content="Détails de l’annonce sur MaisonLouer : photos, prix, description et contact." />

  <link rel="shortcut icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="stylesheet" href="./assets/css/custom.css">
  <link rel="stylesheet" href="./assets/css/fix-header.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <style>
    .annonce-wrap { padding: 120px 0 70px; }
    .annonce-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; margin-bottom: 14px; }
    .annonce-kicker { margin: 0 0 6px; color: #6b7280; font-weight: 800; letter-spacing: .02em; }
    .annonce-title { margin: 0; font-size: 34px; line-height: 1.15; font-weight: 900; color: #111827; }
    .annonce-sub { margin: 10px 0 0; color: #6b7280; }

    .annonce-badges { display: flex; gap: 10px; flex-wrap: wrap; }
    .pill { display:inline-flex;align-items:center;gap:8px;padding:9px 12px;border-radius:999px;font-weight:900;font-size:12px;letter-spacing:.02em;border:1px solid #e5e7eb;background:#fff;color:#111827;white-space:nowrap; }
    .pill.green { background: rgba(16,185,129,.10); border-color: rgba(16,185,129,.25); color: #065f46; }
    .pill.blue { background: rgba(59,130,246,.10); border-color: rgba(59,130,246,.22); color: #1e40af; }
    .pill.gray { background: rgba(17,24,39,.06); border-color: rgba(17,24,39,.12); color: #111827; }

    .annonce-grid { display:grid; grid-template-columns: 1.35fr 0.9fr; gap:18px; align-items:start; margin-top:18px; }

    .card { background:#fff; border:1px solid #e5e7eb; border-radius:18px; box-shadow:0 10px 22px rgba(0,0,0,.06); overflow:hidden; }

    .gallery-main { position:relative; background:#111827; aspect-ratio:16/10; display:flex; align-items:center; justify-content:center; }
    .gallery-main img { width:100%; height:100%; object-fit:cover; display:block; }
    .gallery-nav { position:absolute; inset:0; pointer-events:none; display:flex; align-items:center; justify-content:space-between; padding:14px; }
    .gbtn { pointer-events:all; width:44px; height:44px; border-radius:999px; border:1px solid rgba(255,255,255,.35); background:rgba(0,0,0,.30); color:#fff; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
    .gbtn:active { transform: translateY(1px); }

    .gallery-thumbs { display:grid; grid-template-columns:repeat(6,1fr); gap:10px; padding:12px; background:#fff; border-top:1px solid #e5e7eb; }
    .thumb { border:2px solid transparent; border-radius:12px; overflow:hidden; cursor:pointer; background:#f3f4f6; aspect-ratio:1/1; }
    .thumb img { width:100%; height:100%; object-fit:cover; display:block; }
    .thumb.is-active { border-color: rgba(255,107,0,.85); }

    .side-pad { padding:16px; }
    .price { font-size:28px; font-weight:900; color:#111827; margin:0 0 8px; }
    .meta-row { display:flex; align-items:center; gap:10px; color:#374151; margin-top:8px; }
    .meta-row ion-icon { font-size:18px; }
    .meta-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:14px; }
    .kpi { border:1px solid #e5e7eb; border-radius:14px; padding:10px; background:#fff; text-align:center; }
    .kpi strong { display:block; font-size:16px; color:#111827; }
    .kpi span { display:block; font-size:12px; color:#6b7280; font-weight:800; margin-top:3px; }

    /* ✅ CTA : WhatsApp + Email côte à côte, Retour sur 1 ligne */
    .cta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 16px;
      background: #ffffff;
      border-radius: 16px;
      padding: 0;
      overflow: visible;
    }

    .cbtn {
      border:none;
      border-radius:14px;
      padding: 12px 14px;
      font-weight:900;
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      text-decoration:none;
      width:100%;
      line-height: 1.2;
    }

    .cbtn.primary { background:#ff6b00; color:#fff; }
    .cbtn.dark { background:#111827; color:#fff; }

    .cbtn.ghost {
      grid-column: 1 / -1;
      background:#ffffff !important;
      color:#111827 !important;
      border:2px solid #e5e7eb !important;
      box-shadow: none !important;
      position: relative;
      z-index: 1;
    }

    aside.card { background:#ffffff !important; }

    .content-pad { padding:16px; }
    .h3t { margin:0 0 10px; font-size:18px; font-weight:900; color:#111827; }
    .desc { margin:0; color:#374151; line-height:1.75; white-space:pre-line; }

    .backrow { margin-top:18px; display:flex; gap:12px; flex-wrap:wrap; }
    .backrow a { text-decoration:none; }

    @media (max-width:980px){
      .annonce-grid{grid-template-columns:1fr;}
      .gallery-thumbs{grid-template-columns:repeat(5,1fr);}
      .annonce-title{font-size:30px;}
    }

    @media (max-width:640px){
      .annonce-wrap{padding:105px 0 60px;}
      .annonce-title{font-size:26px;}
      .gallery-thumbs{grid-template-columns:repeat(4,1fr);}
      .price{font-size:24px;}
      .cta { grid-template-columns: 1fr; }
      .cbtn.ghost { grid-column: auto; }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header class="header" data-header>
    <div class="overlay" data-overlay></div>

    <div class="header-bottom">
      <div class="container">

        <a href="index.html" class="logo" aria-label="Retour à l'accueil">
          <img src="./assets/images/logo.webp" alt="Logo MaisonLouer">
        </a>

        <nav class="navbar" data-navbar>
          <div class="navbar-top">
            <a href="index.html" class="logo" aria-label="Retour à l'accueil">
              <img src="./assets/images/logo.webp" alt="Logo MaisonLouer">
            </a>

            <button class="nav-close-btn" data-nav-close-btn aria-label="Fermer le menu">
              <ion-icon name="close-outline"></ion-icon>
            </button>
          </div>

          <div class="navbar-bottom">
            <ul class="navbar-list">
              <li><a href="index.html" class="navbar-link" data-nav-link>Accueil</a></li>
              <li><a href="locations.html" class="navbar-link" data-nav-link>Maisons à louer</a></li>
              <li><a href="ventes.html" class="navbar-link" data-nav-link>Maisons à vendre</a></li>
              <li><a href="recherche.html" class="navbar-link" data-nav-link>Je cherche un bien</a></li>
              <li><a href="contact.html" class="navbar-link" data-nav-link>Contact</a></li>
            </ul>
          </div>
        </nav>

        <div class="header-bottom-actions">
          <button class="header-bottom-actions-btn" data-nav-open-btn aria-label="Ouvrir le menu">
            <ion-icon name="menu-outline"></ion-icon>
            <span>Menu</span>
          </button>
        </div>

      </div>
    </div>
  </header>

  <main class="annonce-wrap">
    <div class="container">
      <div id="annonce-container">
        <p>Annonce en cours de chargement...</p>
      </div>

      <div class="backrow">
        <a href="recherche.html" class="btn">Retour à la recherche</a>
        <a href="locations.html" class="btn">Voir les locations</a>
        <a href="ventes.html" class="btn">Voir les ventes</a>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="footer-bottom">
      <div class="container">
        <p class="copyright">
          &copy; 2026 <a href="index.html">MaisonLouer</a>. Tous droits réservés.
        </p>
      </div>
    </div>
  </footer>

  <script src="./assets/js/script.js"></script>
  <script src="./assets/js/annonce.js"></script>

  <!-- ionicons -->
  <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>

</body>
</html>
